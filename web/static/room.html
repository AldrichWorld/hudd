<!doctype html>
<html lang="en" data-title-key="page.meeting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{APP_NAME}}</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg">
<meta name="theme-color" content="#061a13">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/brand/app/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M5 11a7 7 0 0 0 11.5 5.3M19 11a7 7 0 0 1-.6 2.8M12 18v3M3 3l18 18"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/></symbol>
  <symbol id="i-cam-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 10l6-3v10l-6-3M3 6h9a3 3 0 0 1 3 3v6M15 18H5a2 2 0 0 1-2-2V8M3 3l18 18"/></symbol>
  <symbol id="i-screen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M12 8v6M9 11l3-3 3 3"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-layout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="13" height="16" rx="1.5"/><rect x="18" y="4" width="3" height="4.5" rx="1"/><rect x="18" y="10" width="3" height="4.5" rx="1"/><rect x="18" y="16" width="3" height="4" rx="1"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 4H6l4-4z"/><path d="M12 14v7"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-leave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></symbol>
</svg>

<!-- before joining -->
<a class="brand-float" id="brandFloat" href="/"><img src="/static/brand/logo-mark.svg" alt=""><span class="brand">{{APP_NAME}}<small>Video Conferencing</small></span></a>
<div class="lang-float" id="langFloat" data-lang-switch></div>
<section id="prejoin" class="center-wrap hidden">
  <div class="prejoin">
    <div>
      <div class="preview"><video id="pvVideo" autoplay muted playsinline class="hidden"></video><div class="off" id="pvOff" data-i18n="pj.camOff"></div></div>
      <div class="preview-ctrls">
        <button class="btn secondary" id="pvMic"><svg width="18" height="18"><use href="#i-mic"/></svg></button>
        <button class="btn secondary" id="pvCam"><svg width="18" height="18"><use href="#i-cam-off"/></svg></button>
      </div>
    </div>
    <form class="card" id="pjForm">
      <h2 id="pjTitle"></h2>
      <div class="sub" id="pjSub"></div>
      <div id="pjFields">
        <label for="pjNick" data-i18n="field.nick"></label>
        <input id="pjNick" required maxlength="32" data-i18n-ph="field.nickPh">
      </div>
      <!-- meeting password (guests) -->
      <div id="pjPassWrap" class="hidden">
        <label for="pjPass" data-i18n="pwd.joinLabel"></label>
        <input id="pjPass" maxlength="64" autocomplete="off" spellcheck="false" data-i18n-ph="pwd.joinPh">
      </div>
      <button class="btn block" type="submit" id="pjBtn" data-i18n="pj.enter"></button>
      <div class="err" id="pjErr"></div>
    </form>
  </div>
</section>

<!-- in the meeting -->
<section id="meeting" class="meeting hidden">
  <header class="m-top">
    <img class="m-logo" src="/static/brand/logo-mark.svg" alt="{{APP_NAME}}">
    <span class="m-title" id="mTitle"></span>
    <span class="m-code" id="mCode"></span>
    <span class="spacer"></span>
    <div data-lang-switch></div>
    <div class="lay-wrap">
      <button class="btn secondary" id="mLayout" style="padding:6px 12px"><svg width="16" height="16"><use href="#i-layout"/></svg><span class="lbl-l" data-i18n="m.layout"></span></button>
      <div class="lay-menu hidden" id="layMenu">
        <div class="lay-h" data-i18n="lay.view"></div>
        <label><input type="radio" name="lay" value="auto"> <span data-i18n="lay.auto"></span><small data-i18n="lay.autoSub"></small></label>
        <label><input type="radio" name="lay" value="grid"> <span data-i18n="lay.grid"></span><small data-i18n="lay.gridSub"></small></label>
        <label><input type="radio" name="lay" value="speaker"> <span data-i18n="lay.speaker"></span><small data-i18n="lay.speakerSub"></small></label>
        <div class="lay-h" data-i18n="lay.strip"></div>
        <label><input type="radio" name="strip" value="right"> <span data-i18n="lay.right"></span></label>
        <label><input type="radio" name="strip" value="bottom"> <span data-i18n="lay.bottom"></span></label>
        <div class="lay-h" data-i18n="lay.show"></div>
        <label><input type="checkbox" id="layHideStrip"> <span data-i18n="lay.hideStrip"></span></label>
        <label><input type="checkbox" id="layHideSelf"> <span data-i18n="lay.hideSelf"></span></label>
        <div class="lay-tip" data-i18n="lay.tip"></div>
      </div>
    </div>
    <button class="btn secondary" id="mInvite" style="padding:6px 12px"><svg width="16" height="16"><use href="#i-link"/></svg><span class="lbl-l" data-i18n="m.invite"></span></button>
  </header>
  <div class="m-body" id="mBody">
    <main class="stage" id="stage">
      <div class="grid" id="grid"></div>
      <div class="speaker hidden" id="speakerView">
        <div class="main-area" id="mainArea"></div>
        <div class="divider" id="divider" data-i18n-title="m.dragResize"></div>
        <div class="strip" id="strip"></div>
      </div>
    </main>
    <aside class="panel">
      <div class="mem-h" id="memHead"></div>
      <div class="tab-body mem-split" id="tabMembers">
        <div class="mem-tools hidden" id="memTools">
          <button class="btn secondary sm" id="muteAll"><svg width="14" height="14"><use href="#i-mic-off"/></svg><span data-i18n="mem.muteAll"></span></button>
          <button class="btn secondary sm" id="unmuteAll"><svg width="14" height="14"><use href="#i-mic"/></svg><span data-i18n="mem.unmuteAll"></span></button>
        </div>
        <div class="member-list" id="memberList"></div>
        <section class="chat" id="chat">
          <div class="chat-h" data-i18n="chat.title"></div>
          <div class="chat-list" id="chatList"><div class="chat-empty" id="chatEmpty" data-i18n="chat.empty"></div></div>
          <div class="at-menu hidden" id="atMenu" role="listbox"></div>
          <form class="chat-form" id="chatForm" autocomplete="off">
            <input id="chatInput" maxlength="500" enterkeyhint="send" data-i18n-ph="chat.ph">
            <button class="chat-send" id="chatSend" type="submit" data-i18n-title="chat.send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 L20 4 L14 20 L11 13 Z"/></svg></button>
          </form>
        </section>
      </div>
    </aside>
  </div>
  <footer class="m-ctrl">
    <button class="cbtn" id="cMic"><svg><use href="#i-mic"/></svg><span class="lbl"></span></button>
    <button class="cbtn" id="cCam"><svg><use href="#i-cam"/></svg><span class="lbl"></span></button>
    <button class="cbtn" id="cScreen"><svg><use href="#i-screen"/></svg><span class="lbl"></span></button>
    <button class="cbtn hidden" id="cAnno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="lbl" data-i18n="anno.btn"></span></button>
    <span class="divider"></span>
    <button class="cbtn on-accent" id="cPanel"><svg><use href="#i-people"/></svg><span class="lbl" data-i18n="c.members"></span></button>
    <span class="divider"></span>
    <button class="cbtn leave" id="cLeave"><svg><use href="#i-leave"/></svg><span class="lbl" data-i18n="c.leave"></span></button>
  </footer>
  <div class="banner hidden" id="audioBanner"><button class="btn" data-i18n="m.audioBanner"></button></div>
</section>

<!-- after leaving -->
<section id="ended" class="center-wrap hidden">
  <div class="ended">
    <div class="card">
      <h2 id="edTitle"></h2>
      <div class="sub" id="edSub"></div>
      <div id="edStatus" style="margin-top:14px"></div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn secondary" href="/" data-i18n="ed.home"></a>
      </div>
    </div>
  </div>
</section>


<!-- host asks to unmute; leave dialog -->
<div class="modal-bg hidden" id="askUnmute">
  <div class="modal">
    <h3 data-i18n="ask.unmute"></h3>
    <div class="row">
      <button class="btn secondary" id="auNo" data-i18n="ask.no"></button>
      <button class="btn" id="auYes" data-i18n="ask.ok"></button>
    </div>
  </div>
</div>
<div class="modal-bg hidden" id="leaveModal">
  <div class="modal">
    <h3 data-i18n="leave.title"></h3>
    <p id="leaveText" data-i18n="leave.text"></p>
    <div class="row">
      <button class="btn secondary" id="lmCancel" data-i18n="leave.cancel"></button>
      <button class="btn secondary" id="lmLeave" data-i18n="leave.leave"></button>
      <button class="btn danger" id="lmEnd" data-i18n="leave.end"></button>
    </div>
  </div>
</div>

<script src="/static/vendor/livekit-client.umd.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/annotate.js"></script>
<script src="/static/js/room.js"></script>
</body>
</html>
