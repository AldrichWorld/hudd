name: Feature request
description: Suggest an idea for Hudd
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working. Hudd stays simple (no accounts, no database), so mention if your idea needs either.
